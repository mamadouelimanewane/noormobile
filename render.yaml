services:
  - type: web
    name: noormobile-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: "cd backend && npm install --include=dev && npx prisma generate && npm run build"
    startCommand: "cd backend && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noormobile-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: noormobile-db
    databaseName: noordrive
    user: admin
    plan: free
    region: frankfurt
