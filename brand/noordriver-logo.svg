<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="NOORDRIVER">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0fae5d"/>
      <stop offset="55%" stop-color="#0a8f4c"/>
      <stop offset="100%" stop-color="#066b39"/>
    </linearGradient>
  </defs>

  <!-- Fond noir -->
  <rect x="0" y="0" width="760" height="200" fill="#0e0e10"/>

  <!-- Icone : badge vert, N blanc, trois tirets blancs -->
  <g transform="translate(20,20) scale(0.3125)">
    <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#lgBg)"/>
    <circle cx="366" cy="140" r="150" fill="#ffffff" opacity="0.07"/>
    <g stroke="#ffffff" stroke-linecap="round" stroke-width="16">
      <line x1="76" y1="222" x2="126" y2="222"/>
      <line x1="62" y1="282" x2="126" y2="282"/>
      <line x1="90" y1="342" x2="126" y2="342"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="46">
      <path d="M178 366 V182"/>
      <path d="M178 182 L346 366"/>
      <path d="M346 366 V182"/>
    </g>
  </g>

  <!-- Wordmark, centre sur la hauteur du badge -->
  <text x="212" y="124"
        font-family="Montserrat, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="800" letter-spacing="1.5" fill="#ffffff">NOOR<tspan fill="#3fd68a">DRIVER</tspan></text>
</svg>
