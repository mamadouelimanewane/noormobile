version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: noordrive
      POSTGRES_PASSWORD: noordrive_password
      POSTGRES_DB: noordrive_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://noordrive:noordrive_password@db:5432/noordrive_db
      - PORT=3000
    depends_on:
      - db
    volumes:
      - ./backend/src:/app/src

volumes:
  postgres_data:
